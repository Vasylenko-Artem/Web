<!DOCTYPE html>
<html lang="uk">

<head>
	<meta charset="UTF-8">
	<meta name="author" content="Студент Артемка">
	<title>Новини компанії "SmokeLife"</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<div class="wrapper">
		<!-- Header & Navigation -->
		<header class="header">
			<div class="header__conainer">
				<nav class="nav">
					<ul class="nav-list">
						<li class="nav-item"><a href="author.html">Автор</a></li>
						<li class="nav-item"><a href="company.html">Компанія</a></li>
						<li class="nav-item active"><a href="news.html">Новини</a></li>
						<li class="nav-item"><a href="user.html">Введення інформації</a></li>
					</ul>
				</nav>
			</div>
		</header>

		<!-- Main content -->
		<main class="main">
			<div class="main__container">

				<section id="news-section" class="section">
					<h2 class="section-title">Останні новини</h2>

					<article id="n1" class="news-article">
						<h2 class="news-title">Запуск нової лінії</h2>
						<p class="news-text">
							Ми відкрили нову фабрику у Львові.
							Виробництво вже стартувало.
							Це дозволить знизити ціни на продукцію.
						</p>
					</article>

					<article id="n2" class="news-article">
						<h2 class="news-title">Знижки</h2>
						<p class="news-text">
							Тільки зараз <span class="discount">-20%</span> на сигарети
							Marlboro
						</p>
					</article>
				</section>

				<section class="section">
					<div class="svg-container">
						<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"
							viewBox="-3 -5 10 10">

							<!-- Markers -->
							<defs>
								<marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
									<polygon points="0,0 6,3 0,6" fill="#fff" />
								</marker>

								<path id="curve" d="M -3 2 C -1 4, 3 4, 5 2" fill="none" />
							</defs>

							<!-- Axis -->
							<g>
								<line x1="-4" y1="0" x2="6" y2="0" stroke="#fff" stroke-width="0.02"
									marker-end="url(#arrow)" />
								<text x="6" y="0.3" font-size="0.3">X</text>

								<line x1="0" y1="3" x2="0" y2="-3" stroke="#fff" stroke-width="0.02"
									marker-end="url(#arrow)" />
								<text x="0.2" y="-2.8" font-size="0.3">Y</text>
							</g>

							<g fill="#ff6b00" stroke="#333" stroke-width="0.05" transform="scale(1, -1)">
								<rect x="-2" y="1" width="1" height="1">
									<animate attributeName="fill" values="#ff6b00;#00ff00;#ff6b00" dur="3s"
										repeatCount="indefinite" />
								</rect>

								<rect x="0" y="1" width="2" height="1">
									<animateTransform attributeName="transform" type="translate" values="0,0;0,1;0,0"
										dur="3s" repeatCount="indefinite" />
								</rect>

								<rect x="4" y="1" width="1" height="1">
									<animateTransform attributeName="transform" type="rotate" from="0 4.5 1.5"
										to="360 4.5 1.5" dur="4s" repeatCount="indefinite" />
								</rect>

								<rect x="1" y="-2" width="1" height="1">
									<animateTransform attributeName="transform" type="scale" values="1;1.5;1" dur="3s"
										repeatCount="indefinite" />
								</rect>

								<rect x="4" y="-2" width="1" height="1">
									<animateTransform attributeName="transform" type="skewX" values="0;30;0" dur="2s"
										repeatCount="indefinite" />
								</rect>

								<rect x="-2" y="-1" width="1" height="1" />
								<rect x="-3" y="-2" width="1" height="1" />
								<circle cx="-2" cy="1" r="1" />
								<circle cx="3" cy="0" r="2" />
								<ellipse cx="-1" cy="-1.5" rx="1" ry="0.5" />
							</g>

							<!-- Axis numbers -->
							<g font-size="0.3" fill="white">
								<text x="-3.3" y="0.3">-3</text>
								<text x="-2.3" y="0.3">-2</text>
								<text x="0.7" y="0.3">1</text>
								<text x="5.2" y="0.3">5</text>
								<text x="-0.3" y="0.3">0</text>
								<text x="-0.4" y="1.3">-1</text>
								<text x="-0.4" y="2.3">-2</text>
								<text x="-0.4" y="-0.7">1</text>
								<text x="-0.4" y="-1.7">2</text>
							</g>

						</svg>
					</div>
				</section>

				<section class="section">
					<div class="canvas-container">
						<canvas id="canvas" width="660" height="660"></canvas>
					</div>
				</section>
			</div>
		</main>

		<!-- Footer -->
		<footer class="footer">
			<div class="footer__container">
				<hr class="divider">
				<p class="footer-text">© 2025 SmokeLife</p>
			</div>
		</footer>
	</div>

	<script>
		const canvas = document.getElementById('canvas')
		const ctx = canvas.getContext('2d')

		const width = canvas.width
		const height = canvas.height
		const scale = 66

		function toCanvasX(svgX) {
			return (svgX + 3) * scale
		}

		function toCanvasY(svgY) {
			return height / 2 - svgY * scale
		}

		function drawArrow(x1, y1, x2, y2) {
			const headLength = 8
			const angle = Math.atan2(y2 - y1, x2 - x1)

			ctx.beginPath()
			ctx.moveTo(x1, y1)
			ctx.lineTo(x2, y2)
			ctx.stroke()

			ctx.beginPath()
			ctx.moveTo(x2, y2)
			ctx.lineTo(x2 - headLength * Math.cos(angle - Math.PI / 6), y2 - headLength * Math.sin(angle - Math.PI / 6))
			ctx.lineTo(x2 - headLength * Math.cos(angle + Math.PI / 6), y2 - headLength * Math.sin(angle + Math.PI / 6))
			ctx.closePath()
			ctx.fillStyle = '#fff'
			ctx.fill()
		}

		let time = 0

		function animate() {
			ctx.clearRect(0, 0, width, height)

			// Coordinate axes
			ctx.strokeStyle = '#fff'
			ctx.lineWidth = 1.5

			// X axis
			drawArrow(toCanvasX(-4), toCanvasY(0), toCanvasX(6), toCanvasY(0))
			ctx.fillStyle = '#fff'
			ctx.font = '20px Arial'
			ctx.fillText('X', toCanvasX(6), toCanvasY(0) + 20)

			// Y axis
			drawArrow(toCanvasX(0), toCanvasY(-3), toCanvasX(0), toCanvasY(3))
			ctx.fillText('Y', toCanvasX(0) + 10, toCanvasY(3) + 10)

			// Signatures on axes
			ctx.font = '16px Arial'
			ctx.fillText('-2', toCanvasX(-2) - 20, toCanvasY(0) + 20)
			ctx.fillText('1', toCanvasX(1) - 10, toCanvasY(0) + 20)
			ctx.fillText('5', toCanvasX(5) + 5, toCanvasY(0) + 20)
			ctx.fillText('0', toCanvasX(0) - 20, toCanvasY(0) + 20)
			ctx.fillText('-1', toCanvasX(0) - 25, toCanvasY(-1) + 5)
			ctx.fillText('-2', toCanvasX(0) - 25, toCanvasY(-2) + 5)
			ctx.fillText('1', toCanvasX(0) - 20, toCanvasY(1) + 5)
			ctx.fillText('2', toCanvasX(0) - 20, toCanvasY(2) + 5)

			// Animation for changing color
			const colorPhase = (Math.sin(time * 2 * Math.PI / 3) + 1) / 2
			const r = Math.floor(255 * (1 - colorPhase) + 0 * colorPhase)
			const g = Math.floor(107 * (1 - colorPhase) + 255 * colorPhase)
			const b = Math.floor(0 * (1 - colorPhase) + 0 * colorPhase)

			ctx.strokeStyle = '#333'
			ctx.lineWidth = 3

			// Rect 1: Color change
			ctx.fillStyle = `rgb(${r}, ${g}, ${b})`
			ctx.fillRect(toCanvasX(-2), toCanvasY(2), scale, scale)
			ctx.strokeRect(toCanvasX(-2), toCanvasY(2), scale, scale)

			// Rect 2: up-down movement
			const translateY = Math.sin(time * 2 * Math.PI / 3) * scale
			ctx.fillStyle = '#ff6b00'
			ctx.fillRect(toCanvasX(0), toCanvasY(2) - translateY, scale * 2, scale)
			ctx.strokeRect(toCanvasX(0), toCanvasY(2) - translateY, scale * 2, scale)

			// Rect 3: rotation
			ctx.save()
			const centerX = toCanvasX(4.5)
			const centerY = toCanvasY(1.5)
			ctx.translate(centerX, centerY)
			ctx.rotate(-(time * 2 * Math.PI / 4))
			ctx.translate(-centerX, -centerY)
			ctx.fillStyle = '#ff6b00'
			ctx.fillRect(toCanvasX(4), toCanvasY(2), scale, scale)
			ctx.strokeRect(toCanvasX(4), toCanvasY(2), scale, scale)
			ctx.restore()

			// Rect 4: Scaling
			const scaleValue = 1 + 0.2 * Math.sin(time * 2 * Math.PI / 3)
			const rectSize = scale * scaleValue
			const offsetX = (scale - rectSize) / 2
			const offsetY = (scale - rectSize) / 2
			ctx.fillStyle = '#ff6b00'
			ctx.fillRect(toCanvasX(1) - offsetX, toCanvasY(-1) - offsetY, rectSize, rectSize)
			ctx.strokeRect(toCanvasX(1) - offsetX, toCanvasY(-1) - offsetY, rectSize, rectSize)

			// Rect 5: skew
			ctx.save()
			const skewAngle = (5 * Math.sin(time * 2 * Math.PI / 2)) * Math.PI / 180
			ctx.transform(1, 0, Math.tan(skewAngle), 1, 0, 0)
			ctx.fillStyle = '#ff6b00'
			ctx.fillRect(toCanvasX(4), toCanvasY(-1), scale, scale)
			ctx.strokeRect(toCanvasX(4), toCanvasY(-1), scale, scale)
			ctx.restore()

			// Static rect
			ctx.fillStyle = '#ff6b00'
			ctx.fillRect(toCanvasX(-2), toCanvasY(0), scale, scale)
			ctx.strokeRect(toCanvasX(-2), toCanvasY(0), scale, scale)

			ctx.fillRect(toCanvasX(-3), toCanvasY(-1), scale, scale)
			ctx.strokeRect(toCanvasX(-3), toCanvasY(-1), scale, scale)

			// Circles
			ctx.beginPath()
			ctx.arc(toCanvasX(-2), toCanvasY(1), scale, 0, 2 * Math.PI)
			ctx.fill()
			ctx.stroke()

			ctx.beginPath()
			ctx.arc(toCanvasX(3), toCanvasY(0), scale * 2, 0, 2 * Math.PI)
			ctx.fill()
			ctx.stroke()

			// Ellipse
			ctx.beginPath()
			ctx.ellipse(toCanvasX(-1), toCanvasY(-1.5), scale, scale * 0.5, 0, 0, 2 * Math.PI)
			ctx.fill()
			ctx.stroke()

			time += 1 / 60
			requestAnimationFrame(animate)
		}

		animate()
	</script>

	<script src="js/script.js"></script>

</body>

</html>
