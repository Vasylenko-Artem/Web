<!DOCTYPE html>
<html lang="uk">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Медіа-бібліотека</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="css/media.css">
</head>

<body>
	<div class="wrapper">
		<!-- Header & Navigation -->
		<header class="header">
			<div class="header__conainer">
				<nav class="nav">
					<ul class="nav-list">
						<li class="nav-item"><a href="author.html">Автор</a></li>
						<li class="nav-item"><a href="company.html">Компанія</a></li>
						<li class="nav-item"><a href="news.html">Новини</a></li>
						<li class="nav-item"><a href="user.html">Введення інформації</a></li>
						<li class="nav-item active"><a href="media.html">Медіа-бібліотека</a></li>
					</ul>
				</nav>
			</div>
		</header>

		<!-- Main -->
		<main class="main">
			<div class="main__container">
				<section class="section">
					<!-- <h2 class="section-title">Media Player</h2> -->

					<div class="player-layout">
						<!-- Left side - Player -->
						<div class="player-main">
							<!-- Track Info -->
							<div class="track-info">
								<div class="track-title" id="trackTitle">Mercury Retrograde</div>
								<div class="track-artist" id="trackArtist">Ghostemane</div>
							</div>

							<!-- Toggle Audio/Video -->
							<div class="media-toggle" id="mediaToggle">
								<div class="media-toggle-option active" data-mode="audio">Audio</div>
								<div class="media-toggle-option" data-mode="video">Video</div>
							</div>

							<!-- Media Display -->
							<div class="media-display">
								<img id="cover" src="media/Ghostemane/Ghostemane_Mercury_Retrograde.jpg" alt="Cover"
									class="cover active">
								<video id="videoPlayer" poster="media/Ghostemane/Ghostemane_Mercury_Retrograde.jpg"
									class="video-wrapper">
									<source src="media/Ghostemane/Ghostemane_Mercury_Retrograde.mp4" type="video/mp4">
									Ваш браузер не підтримує відео.
								</video>
							</div>

							<!-- Controls -->
							<div class="control-center">
								<div class="progress-section">
									<input type="range" id="progress" min="0" max="100" value="0">
									<div class="time-display">
										<span id="time">0:00</span>
										<span id="duration">0:00</span>
									</div>
								</div>

								<div class="controls-buttons">
									<button class="control-btn" id="prevBtn">⏮</button>
									<button class="control-btn play-btn" id="playPause">▶</button>
									<button class="control-btn" id="nextBtn">⏭</button>
								</div>
							</div>

							<!-- Audio -->
							<audio id="audioPlayer">
								<source src="media/Ghostemane/Ghostemane_Mercury_Retrograde.mp3" type="audio/mpeg">
								Ваш браузер не підтримує аудіо.
							</audio>
						</div>

						<!-- Right side - Playlist -->
						<div class="playlist-sidebar">
							<div class="playlist-header">
								<h3>Плейліст</h3>
								<div class="playlist-stats" id="playlistStats">3 треки</div>
							</div>
							<div class="playlist" id="playlist"></div>
						</div>
					</div>
				</section>
			</div>
		</main>

		<!-- Footer -->
		<footer class="footer">
			<hr class="divider">
			<p class="footer-text">© 2025 SmokeLife</p>
		</footer>
	</div>

	<script src="js/media.js"></script>
</body>
